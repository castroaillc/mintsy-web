# Points the dev client at Metro and dismisses expo-dev-client overlays.
# Run right after launchApp. Env: METRO_URL_ENC (url-encoded Metro URL)
appId: com.getmintsy.app.dev
---
- openLink: mintsy-dev://expo-development-client/?url=${METRO_URL_ENC}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      text: "This is the developer menu.*|Create account|Home|Continue watching|Profile"
    timeout: 90000
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Toggle element inspector"
    commands:
      - tapOn:
          id: "xmark"
- waitForAnimationToEnd
