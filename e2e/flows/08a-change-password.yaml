# Scenario 8a: Settings › Change password, sign out, sign in with the new password; then sign out and request a reset link.
# Env: EMAIL, PASSWORD, PASSWORD2
appId: com.getmintsy.app.dev
name: 08a Change password and forgot password
---
- runFlow: common/open-home.yaml
- tapOn: "Profile"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Change password"
    direction: DOWN
- tapOn: "Change password"
- tapOn:
    id: "input-current-password"
- inputText: ${PASSWORD}
- tapOn:
    id: "input-new-password"
- inputText: ${PASSWORD2}
- tapOn:
    id: "input-confirm-new-password"
- inputText: ${PASSWORD2}
- scrollUntilVisible:
    element:
      id: "change-password-submit"
    direction: DOWN
- tapOn:
    id: "change-password-submit"
- extendedWaitUntil:
    visible: "Password changed.*"
    timeout: 15000
- takeScreenshot: 08a-password-changed
- runFlow: common/sign-out.yaml

# Sign in with the new password
- runFlow:
    file: common/sign-in.yaml
    env:
      SIGNIN_PASSWORD: ${PASSWORD2}
- extendedWaitUntil:
    visible: "Featured series"
    timeout: 30000
- takeScreenshot: 08b-signed-in-new-password

# Sign out again and ask for a reset link
- tapOn: "Profile"
- tapOn: "Settings"
- runFlow: common/sign-out.yaml
- scrollUntilVisible:
    element: "Sign in"
    direction: DOWN
- tapOn: "Sign in"
- tapOn: "Forgot password?"
- tapOn:
    id: "input-email"
- inputText: ${EMAIL}
- tapOn: "Send reset link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 15000
- takeScreenshot: 08c-reset-link-sent
