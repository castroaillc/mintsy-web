# Scenario 5: save the series to My List (Home's featured card), see it in My List, remove it.
# (The series page has the same "Add … to My List" label; Home stays mounted under it, so the flow saves from Home.)
appId: com.getmintsy.app.dev
name: 05 My List
---
- runFlow: common/open-home.yaml
- tapOn: "Add The Psychology of Money to My List"
- extendedWaitUntil:
    visible: "Remove The Psychology of Money from My List"
    timeout: 10000
- tapOn: "My List"
- extendedWaitUntil:
    visible: "The Psychology of Money by Morgan Housel"
    timeout: 10000
- takeScreenshot: 05a-my-list-saved
- tapOn: "Remove The Psychology of Money from My List"
- extendedWaitUntil:
    visible: "Nothing saved yet"
    timeout: 10000
- takeScreenshot: 05b-my-list-empty
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Add The Psychology of Money to My List"
    timeout: 10000
