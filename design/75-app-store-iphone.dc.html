<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store screenshot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
.dc-annot{display:none !important}
.shot a{pointer-events:none}
</style>
</helmet>
<div class="shot" style="position: relative; width: {{w}}px; height: {{h}}px; overflow: hidden; background: {{bg}}; font-family: Inter, system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; left: 50%; top: {{glowTop}}px; width: {{glowSize}}px; height: {{glowSize}}px; margin-left: {{glowOffset}}px; border-radius: 50%; background: {{glow}}; filter: blur({{glowBlur}}px)"></div>

<div style="position: relative; box-sizing: border-box; height: {{capH}}px; padding: {{padTop}}px {{padX}}px 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: {{gap}}px">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{logoSize}}px; letter-spacing: -0.5px; line-height: 1; color: {{fg}}">mintsy<span style="color: {{dot}}">.</span></div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: {{headSize}}px; line-height: 1.04; letter-spacing: -0.02em; color: {{fg}}; text-wrap: balance">{{s.head}}</h1>
<p style="margin: 0; font-size: {{subSize}}px; line-height: 1.35; font-weight: 500; color: {{sub}}; text-wrap: balance">{{s.sub}}</p>
</div>

<div style="position: absolute; left: 50%; top: {{capH}}px; margin-left: {{phoneOffset}}px; width: {{phoneW}}px; height: {{phoneH}}px; box-sizing: border-box; padding: {{bezel}}px; border-radius: {{outerR}}px; background: #050608; box-shadow: 0 0 0 {{ring}}px #3A3D49, 0 {{shadowY}}px {{shadowBlur}}px rgba(0,0,0,0.45)">
<div style="position: relative; width: {{scrW}}px; height: {{scrH}}px; overflow: hidden; border-radius: {{innerR}}px; background: {{s.top}}">
<div style="position: relative; height: {{barH}}px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; padding: 0 {{barPadX}}px; color: #F2F2F5; font-family: Inter, sans-serif; font-weight: 600; font-size: {{timeSize}}px">
<span>9:41</span>
<div style="position: absolute; left: 50%; top: {{islandTop}}px; width: {{islandW}}px; height: {{islandH}}px; margin-left: {{islandOffset}}px; border-radius: 999px; background: #000"></div>
<svg width="{{iconsW}}" height="{{iconsH}}" viewBox="0 0 74 13" fill="#F2F2F5" aria-hidden="true"><rect x="0" y="9" width="3.4" height="4" rx="1"></rect><rect x="5" y="6.5" width="3.4" height="6.5" rx="1"></rect><rect x="10" y="4" width="3.4" height="9" rx="1"></rect><rect x="15" y="1" width="3.4" height="12" rx="1"></rect><path d="M33 3.2c2.6 0 5 1 6.8 2.7l1.3-1.4A11.6 11.6 0 0 0 33 1.3c-3.1 0-6 1.2-8.1 3.2l1.3 1.4A9.7 9.7 0 0 1 33 3.2zm0 3.6c1.6 0 3.1.6 4.2 1.7l1.3-1.4A7.8 7.8 0 0 0 33 4.9c-2.1 0-4 .8-5.5 2.2l1.3 1.4c1.1-1.1 2.6-1.7 4.2-1.7zm0 3.6c.6 0 1.2.2 1.6.6L33 12.7l-1.6-1.7c.4-.4 1-.6 1.6-.6z"></path><rect x="47.5" y="0.75" width="22" height="11.5" rx="3.6" fill="none" stroke="#F2F2F5" stroke-opacity="0.45" stroke-width="1.2"></rect><rect x="49.5" y="2.75" width="18" height="7.5" rx="2"></rect><path d="M71.2 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity="0.45"></path></svg>
</div>
<div style="width: 390px; transform: scale({{k}}); transform-origin: top left">
<sc-if value="{{is1}}" hint-placeholder-val="{{ true }}"><dc-import name="Book" plan="premium" hint-size="390px,2160px"></dc-import></sc-if>
<sc-if value="{{is2}}" hint-placeholder-val="{{ false }}"><dc-import name="Player" hint-size="390px,1320px"></dc-import></sc-if>
<sc-if value="{{is3}}" hint-placeholder-val="{{ false }}"><dc-import name="TranscriptReader" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{is4}}" hint-placeholder-val="{{ false }}"><dc-import name="Main" hint-size="390px,1560px"></dc-import></sc-if>
<sc-if value="{{is5}}" hint-placeholder-val="{{ false }}"><dc-import name="Library" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{is6}}" hint-placeholder-val="{{ false }}"><dc-import name="Profile" plan="premium" hint-size="390px,1280px"></dc-import></sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"shot":{"editor":"enum","options":["1","2","3","4","5","6"],"default":"1"},"w":{"editor":"int","default":440,"min":300,"max":1400},"h":{"editor":"int","default":956,"min":500,"max":3000},"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
  renderVals() {
    const n = String(this.props.shot ?? '1');
    const w = Number(this.props.w ?? 440), h = Number(this.props.h ?? 956);
    const shots = {
      '1': { head: 'Every book, as a 5‑minute video series', sub: 'One episode per chapter. First 3 episodes of every book are free.', top: '#24382F', theme: 'gold' },
      '2': { head: 'Get a whole chapter in 5 minutes', sub: 'Short episodes that keep the author’s best ideas.', top: '#24382F', theme: 'dark' },
      '3': { head: 'Read along with every episode', sub: 'Full transcripts. Tap any line to jump there.', top: '#0D0E12', theme: 'dark' },
      '4': { head: 'Find your next big idea', sub: 'Finance, business, psychology, history and more.', top: '#0D0E12', theme: 'gold' },
      '5': { head: 'Pick up right where you left off', sub: 'Save series to My List. Your place is kept in every book.', top: '#0D0E12', theme: 'dark' },
      '6': { head: 'Build a 5‑minute daily habit', sub: 'Set a goal, keep a streak, finish more books.', top: '#0D0E12', theme: 'dark' }
    };
    const s = shots[n] || shots['1'];
    const gold = s.theme === 'gold';
    // layout scales from the shorter side so any App Store size works
    const u = Math.min(w / 440, h / 956);
    const capH = Math.round(h * (w / h > 0.6 ? 0.29 : 0.30));
    const kFit = Math.min(0.80 * w / 390, 0.86 * h / 844);
    const k = kFit;
    const bezel = Math.round(11 * k), ring = Math.max(1, Math.round(1.6 * k));
    const scrW = Math.round(390 * k), barH = Math.round(50 * k);
    const scrH = Math.round(844 * k) + barH;
    const phoneW = scrW + bezel * 2, phoneH = scrH + bezel * 2;
    return {
      s, w, h, capH, k,
      is1: n === '1', is2: n === '2', is3: n === '3', is4: n === '4', is5: n === '5', is6: n === '6',
      bg: gold ? '#F5B83D' : '#0D0E12',
      fg: gold ? '#15161B' : '#F2F2F5',
      sub: gold ? '#3D3420' : '#A3A5B0',
      dot: gold ? '#15161B' : '#F5B83D',
      glow: gold ? 'rgba(255,226,150,0.9)' : 'rgba(245,184,61,0.22)',
      glowSize: Math.round(w * 1.1), glowOffset: -Math.round(w * 0.55), glowTop: Math.round(capH * 0.9), glowBlur: Math.round(90 * u),
      padTop: Math.round(h * (w / h > 0.6 ? 0.05 : 0.065)), padX: Math.round(30 * u), gap: Math.round(12 * u),
      logoSize: Math.round(20 * u), headSize: Math.round(38 * u), subSize: Math.round(16 * u),
      phoneW, phoneH, phoneOffset: -Math.round(phoneW / 2), bezel, ring,
      outerR: Math.round(58 * k), innerR: Math.round(47 * k),
      shadowY: Math.round(30 * u), shadowBlur: Math.round(70 * u),
      scrW, scrH, barH, barPadX: Math.round(30 * k), timeSize: Math.round(16 * k),
      islandW: Math.round(122 * k), islandH: Math.round(35 * k), islandTop: Math.round(10 * k), islandOffset: -Math.round(61 * k),
      iconsW: Math.round(74 * k), iconsH: Math.round(13 * k)
    };
  }
}
</script>
</body>
</html>
