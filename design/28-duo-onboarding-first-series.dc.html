<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo onboarding: first series</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="none" top="back" back-href="DuoOnbReminders.dc.html" show-tabs="false" hint-size="84px,820px"></dc-import>

<section style="flex: none; width: 456px; box-sizing: border-box; padding: 56px 48px; border-right: 1px solid #1E2028; display: flex; flex-direction: column; gap: 32px">
<ol aria-label="Onboarding steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li aria-current="{{s.current}}" style="display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: {{s.weight}}; color: {{s.fg}}">
<span style="flex: none; width: 28px; height: 28px; border-radius: 14px; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: #15161B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{s.mark}}</span>
{{s.label}}
</li>
</sc-for>
</ol>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Step 4 of 4</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.08; letter-spacing: -0.6px">Start your first series</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">Picked from your interests. You can add more later.</p>
</div>
</section>

<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 48px 48px 32px">
<div role="radiogroup" aria-label="First series" style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="3">
<button role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="display: flex; align-items: center; gap: 16px; width: 100%; padding: 12px; border-radius: 16px; border: 1px solid {{b.bd}}; background: {{b.bg}}; color: #F2F2F5; text-align: left; font-family: Inter, sans-serif; cursor: pointer">
<span style="flex: none; width: 76px; height: 114px; border-radius: 6px; background: {{b.cover}}; color: #1C1C1C; box-sizing: border-box; padding: 8px 7px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; line-height: 1.1">{{b.title}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 600; color: {{accent}}">{{b.tag}}</span>
<span style="font-size: 17px; font-weight: 600">{{b.title}}</span>
<span style="font-size: 14px; color: #A3A5B0">{{b.author}} · {{b.meta}}</span>
</span>
<span style="flex: none; width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{b.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{b.dot}}"></span></span>
</button>
</sc-for>
</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<a href="DuoBrowseOpen.dc.html" style="height: 52px; padding: 0 18px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #A3A5B0">Browse all series instead</a>
<a href="DuoPlayerOpen.dc.html" style="min-width: 220px; height: 52px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
Start Episode 1
</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const step = 4;
    const steps = ['Interests', 'Daily time', 'Reminders', 'First series'].map((label, i) => {
      const n = i + 1, done = n < step, cur = n === step;
      return { label, current: cur ? 'step' : 'false', mark: done ? '✓' : String(n), fill: done ? accent : 'transparent', ring: done || cur ? accent : '#3A3D49', fg: cur ? '#F2F2F5' : done ? '#C9CAD2' : '#8B8D99', weight: cur ? 600 : 500 };
    });
    const defs = [
      { title: 'The Psychology of Money', author: 'Morgan Housel', tag: 'Because you picked Finance', meta: '20 episodes', cover: '#E7DFCF' },
      { title: 'Thinking, Fast and Slow', author: 'Daniel Kahneman', tag: 'Because you picked Psychology', meta: '38 episodes', cover: '#F0EEE9' },
      { title: 'Atomic Habits', author: 'James Clear', tag: 'Because you picked Productivity', meta: '20 episodes', cover: '#C9D6CF' }
    ];
    const books = defs.map((d, i) => {
      const on = this.state.sel === i;
      return Object.assign({}, d, { on, bd: on ? accent : '#2A2C36', bg: on ? '#1A1912' : '#15161C', ring: on ? accent : '#4A4D5A', dot: on ? accent : 'transparent', pick: () => this.setState({ sel: i }) });
    });
    return { accent, steps, books };
  }
}
</script>
</body>
</html>
