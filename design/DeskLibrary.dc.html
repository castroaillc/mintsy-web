<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My List</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D18}
.dk{container-type:inline-size}
.dk a{color:inherit;text-decoration:none}
.dk button,.dk input{font-family:inherit}
.dk input::placeholder{color:#7A7394}
.dk-shell{display:flex;min-height:900px}
.dk-nav{flex:none;width:248px;box-sizing:border-box;padding:24px 16px;border-right:1px solid #2A2740;background:#13111E;display:flex;flex-direction:column;gap:28px}
.dk-navlist{display:flex;flex-direction:column;gap:4px}
.dk-main{flex:1;min-width:0}
.dk-pad{padding:32px 48px 64px}
.dk .dk-navitem:hover{background:#201D2E;color:#F4F2F8}
.dk .dk-btn:hover{background:#FF8E7D}
.dk .dk-ghost:hover{border-color:#57516F;background:#1B1929}
.dk .dk-card:hover{border-color:#45405E}
.dk .dk-row:hover{background:#1B1929}
.dk .dk-link:hover{color:#FF8E7D}
.dk .dk-cover:hover{transform:translateY(-3px)}
.dk-cover{transition:transform .15s ease}
@media (prefers-reduced-motion: reduce){.dk-cover{transition:none}.dk .dk-cover:hover{transform:none}}
@container (max-width: 860px){
  .dk-shell{flex-direction:column}
  .dk-nav{width:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;border-right:0;border-bottom:1px solid #2A2740;gap:12px}
  .dk-navlist{flex-direction:row;gap:2px}
  .dk-navlabel,.dk-hide-sm{display:none !important}
  .dk-pad{padding:24px 20px 48px}
}
@container (max-width: 520px){ .dk-pad{padding:20px 16px 40px} }
</style>
</helmet>
<div class="dk" style="width: 100%; min-width: 0; min-height: 900px; background: #0E0D18; color: #F4F2F8; font-family: Inter, system-ui, sans-serif">
<div class="dk-shell"><nav class="dk-nav" aria-label="Main"><a href="DeskHome.dc.html" aria-label="mintsy home" style="padding: 4px 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.03em; line-height: 1">mintsy<span style="color: #FF6B57">.</span></span></a><div class="dk-navlist"><a class="dk-navitem" href="DeskHome.dc.html" aria-label="Home" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span class="dk-navlabel">Home</span></a><a class="dk-navitem" href="DeskSearch.dc.html" aria-label="Search" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><span class="dk-navlabel">Search</span></a><a class="dk-navitem" href="DeskLibrary.dc.html" aria-current="page" aria-label="My List" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: #201D2E; color: #F4F2F8; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><span class="dk-navlabel">My List</span></a><a class="dk-navitem" href="DeskProfile.dc.html" aria-label="Profile" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg><span class="dk-navlabel">Profile</span></a></div><div class="dk-hide-sm" style="margin-top: auto; display: flex; flex-direction: column; gap: 16px"><a class="dk-card" href="DeskPlayer.dc.html" style="padding: 12px; border-radius: 14px; background: #181626; border: 1px solid #2A2740; display: flex; gap: 12px; align-items: center"><div style="flex: none; width: 44px; height: 44px; border-radius: 10px; background: #2B2850; display: flex; align-items: center; justify-content: center; color: #F4F2F8"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></div><div style="min-width: 0"><div style="font-size: 12px; font-weight: 600; color: #FF6B57">Continue · Episode 4 of 20</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Confounding Compounding</div></div></a><a class="dk-navitem" href="DeskProfile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px"><div style="flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #FF6B57; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700">S</div><div><div style="font-size: 14px; font-weight: 600">Steve</div><div style="font-size: 12px; color: #9690AE">Premium · Yearly</div></div></a></div></nav><main class="dk-main"><div class="dk-pad" style="display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance">My List</h1>
<div role="tablist" aria-label="My List" style="display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: #1B1929; align-self: flex-start">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button></sc-for>
</div>
<div style="font-size: 14px; color: #ACA6C2">{{countLabel}}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 16px">
<sc-for list="{{items}}" as="b" hint-placeholder-count="4">
<div class="dk-card" style="display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 16px; background: #181626; border: 1px solid #2A2740">
<a href="DeskBook.dc.html" style="flex: none; width: 72px"><div style="aspect-ratio: 2 / 3; border-radius: 6px; background: {{b.bg}}; color: {{b.fg}}; padding: 7px; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 10px; line-height: 1.1">{{b.title}}</div></a>
<a href="DeskBook.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 16px; font-weight: 600">{{b.title}}</div><div style="font-size: 13px; color: {{b.metaColor}}">{{b.meta}}</div>
<sc-if value="{{b.hasProgress}}" hint-placeholder-val="{{ false }}"><div style="height: 4px; border-radius: 2px; background: #332F4A; margin-top: 6px"><div style="width: {{b.pct}}; height: 4px; border-radius: 2px; background: #FF6B57"></div></div></sc-if></a>
<a class="dk-ghost" href="{{b.href}}" aria-label="{{b.action}}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #3D3956; display: flex; align-items: center; font-size: 13px; font-weight: 600">{{b.action}}</a>
</div>
</sc-for>
</div>
</div></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'saved' };
  }
  renderVals() {
    const sets = {
      saved: [
        { title: 'Thinking, Fast and Slow', meta: '38 episodes · Saved 2 days ago', bg: '#F0EEE9', fg: '#1C1C1C' },
        { title: 'Atomic Habits', meta: '20 episodes · Saved last week', bg: '#D3CFF0', fg: '#1C1C1C' },
        { title: 'The Lean Startup', meta: '14 episodes · Saved last week', bg: '#3A2F5B', fg: '#F2EEFA' },
        { title: 'Sapiens', meta: '20 episodes · Saved Oct 12', bg: '#B9542F', fg: '#FFF4EE' }
      ].map((b) => Object.assign(b, { action: 'Play Episode 1', href: 'DeskPlayer.dc.html', metaColor: '#9690AE', hasProgress: false })),
      progress: [
        { title: 'The Psychology of Money', meta: 'Episode 4 of 20 · 3 min left', pct: '17%', bg: '#E7DFCF', fg: '#1C1C1C' },
        { title: 'The Intelligent Investor', meta: 'Episode 2 of 20 · 1 min left', pct: '8%', bg: '#1E3557', fg: '#F4EFE6' },
        { title: 'Rich Dad Poor Dad', meta: 'Episode 2 of 10 · 4 min left', pct: '15%', bg: '#5B2333', fg: '#F7E9EC' }
      ].map((b) => Object.assign(b, { action: 'Resume', href: 'DeskPlayer.dc.html', metaColor: '#FF6B57', hasProgress: true })),
      finished: [
        { title: 'I Will Teach You to Be Rich', meta: 'Finished Oct 20 · 10 episodes', bg: '#F0604D', fg: '#1C1C1C' }
      ].map((b) => Object.assign(b, { action: 'Recap', href: 'DeskSeriesComplete.dc.html', metaColor: '#8FD3FF', hasProgress: false }))
    };
    const labels = { saved: ['Saved', '4 saved series'], progress: ['In progress', '3 series in progress'], finished: ['Finished', '1 finished series'] };
    const tabs = Object.keys(labels).map((id) => {
      const on = this.state.tab === id;
      return { label: labels[id][0], on, bg: on ? '#F4F2F8' : 'transparent', fg: on ? '#1A1424' : '#ACA6C2', pick: () => this.setState({ tab: id }) };
    });
    return { tabs, items: sets[this.state.tab], countLabel: labels[this.state.tab][1] };
  }
}
</script>
</body>
</html>
