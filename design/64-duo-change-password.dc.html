<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo change password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="profile" top="back" back-href="DuoSettings.dc.html" hint-size="84px,820px"></dc-import>
<section style="flex: none; width: 456px; box-sizing: border-box; padding: 40px; border-right: 1px solid #1E2028; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px">Change password</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">Use at least 8 characters. A longer phrase is easier to remember and harder to guess.</p>
<div style="margin-top: 8px; padding: 16px; border-radius: 16px; background: #15161C; border: 1px solid #23252E; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Signed in on 2 devices</div>
<div style="font-size: 13px; line-height: 1.5; color: #A3A5B0">This iPhone Duo · iPad. Signing out other devices keeps your progress; they’ll just need the new password.</div>
</div>
</section>
<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 40px 56px">
<form style="max-width: 420px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dcp-current" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Current password</label>
<input id="dcp-current" type="password" autocomplete="current-password" placeholder="Your current password" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
<a href="DuoForgotPassword.dc.html" style="align-self: flex-start; font-size: 14px; font-weight: 500; color: {{accent}}">Forgot it?</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dcp-new" style="font-size: 14px; font-weight: 600; color: #D4D5DC">New password</label>
<input id="dcp-new" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dcp-confirm" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Confirm new password</label>
<input id="dcp-confirm" type="password" autocomplete="new-password" placeholder="Type it again" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{accent}}">Sign out of other devices</label>
<a href="DuoSettings.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Update password</a>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5B83D' };
  }
}
</script>
</body>
</html>
