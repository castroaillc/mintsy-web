<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 12px 20px; background: #121318; border-top: 1px solid #23252E; display: flex; justify-content: space-around; font-family: Inter, system-ui, sans-serif">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 64px; color: {{t.color}}; font-size: 11px; font-weight: {{t.weight}}; text-decoration: none">
<sc-if value="{{t.isHome}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg></sc-if>
<sc-if value="{{t.isSearch}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></sc-if>
<sc-if value="{{t.isList}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></sc-if>
<sc-if value="{{t.isProfile}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></sc-if>
{{t.label}}
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","search","list","profile"],"default":"home"},"accent":{"editor":"color","default":"#F5B83D"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const active = this.props.active ?? 'home';
    const defs = [['home', 'Home', 'Main.dc.html'], ['search', 'Search', 'SearchResults.dc.html'], ['list', 'My List', 'Library.dc.html'], ['profile', 'Profile', 'Profile.dc.html']];
    const tabs = defs.map(([id, label, href]) => {
      const on = id === active;
      return { label, href, current: on ? 'page' : 'false', color: on ? accent : '#A3A5B0', weight: on ? 600 : 500, isHome: id === 'home', isSearch: id === 'search', isList: id === 'list', isProfile: id === 'profile' };
    });
    return { tabs };
  }
}
</script>
</body>
</html>
