[project]
name = "mintsy-tts"
version = "0.1.0"
description = "Local text-to-speech for the studio voice step (Kokoro)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "kokoro>=0.9.4",
  "soundfile>=0.12",
  # misaki (Kokoro's phonemizer) loads this spaCy model; pinned so it isn't downloaded at runtime
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
