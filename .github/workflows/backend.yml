name: Backend CI/CD

# apps/backend only (GraphQL API + Better Auth). Installs at the repo root (one lockfile)
# and builds the image from the root context.
on:
  push:
    branches: ["**"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  # Cancel superseded CI runs on the same branch; never cancel a production deploy mid-way
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PROJECT_ID: mintsy-prod
  REGION: us-central1
  SERVICE: mintsy-api
  IMAGE: us-central1-docker.pkg.dev/mintsy-prod/mintsy/api

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from the root package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mintsy-backend...
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm build

  integration:
    name: Docker image + auth smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      - name: Start MongoDB (single-node replica set, needed for Better Auth transactions)
        run: |
          # mongo 7.0: MongoDB 8.0+ refuses to start on Linux kernel 6.19+, which some
          # GitHub runners use (https://jira.mongodb.org/browse/SERVER-121912)
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null && break
            sleep 1
          done || true
          if [ "$(docker inspect -f '{{.State.Running}}' mongo)" != "true" ]; then
            docker logs mongo | tail -40
            exit 1
          fi
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"

      - name: Build production image
        working-directory: .
        run: |
          docker build -f apps/backend/Dockerfile -t mintsy-api:ci \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Run image
        run: |
          docker run -d --name api --network host \
            -e PORT=8080 \
            -e "MONGODB_URI=mongodb://localhost:27017/ci?directConnection=true" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e BETTER_AUTH_URL=http://localhost:8080 \
            -e CORS_ORIGINS= \
            mintsy-api:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          # The image reports the commit it was built from
          curl -sf http://localhost:8080/version | tee /dev/stderr | grep -q "\"commit\":\"$GITHUB_SHA\""

      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter mintsy-backend...
        working-directory: .
      - name: Tests (account deletion)
        run: pnpm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/ci-test?directConnection=true

      - name: Container logs
        if: failure()
        run: docker logs api

  deploy:
    name: Deploy to Cloud Run
    needs: [check, integration]
    # Production (Cloud Run mintsy-api) deploys from this repo on pushes to main.
    # Workload Identity (provider github-oidc) only trusts castroaillc/mintsy-web on refs/heads/main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no stored keys)
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/884851838962/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@mintsy-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f apps/backend/Dockerfile -t "$IMAGE:$GITHUB_SHA" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
          docker push "$IMAGE:$GITHUB_SHA"

      # Only swaps the image; env vars, secrets and scaling stay as configured on the service
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --quiet

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$URL/health"

      - name: Version check (serving this commit)
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          for i in $(seq 1 10); do
            BODY=$(curl --fail --silent --show-error "$URL/version" || true)
            echo "$BODY"
            if printf '%s' "$BODY" | grep -qF "\"commit\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::$URL/version does not report commit $GITHUB_SHA"
          exit 1
