<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo create account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="none" top="back" back-href="DuoAuthWelcome.dc.html" show-tabs="false" hint-size="84px,820px"></dc-import>

<section style="flex: none; width: 456px; box-sizing: border-box; padding: 64px 48px; background: #24382F; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.6px">Create account</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #D6E2DA">It only takes a minute. Then pick what you want to learn.</p>
<ul style="list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px; color: #E9EFEA">
<li style="display: flex; gap: 10px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>First 3 episodes of every book, free</li>
<li style="display: flex; gap: 10px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>5-minute episodes with transcripts</li>
<li style="display: flex; gap: 10px; align-items: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>Progress saved across your devices</li>
</ul>
</section>

<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 48px 56px">
<form style="max-width: 420px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dsu-name" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Name</label>
<input id="dsu-name" type="text" autocomplete="name" placeholder="Jane Doe" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dsu-email" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Email</label>
<input id="dsu-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dsu-pass" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Password</label>
<div style="display: flex; align-items: center; height: 52px; padding: 0 4px 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C">
<input id="dsu-pass" type="{{passType}}" autocomplete="new-password" placeholder="At least 8 characters" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #A3A5B0; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</div>
<div style="font-size: 13px; color: #8B8D99">Use at least 8 characters.</div>
</div>
<a href="DuoOnbInterests.dc.html" style="margin-top: 8px; height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Create account</a>
<p style="margin: 4px 0 0; text-align: center; font-size: 15px; color: #A3A5B0">Already have an account? <a href="DuoAuthSignIn.dc.html" style="font-weight: 600; color: #F2F2F5">Sign in</a></p>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#F5B83D',
      passType: this.state.show ? 'text' : 'password',
      toggleLabel: this.state.show ? 'Hide password' : 'Show password',
      toggle: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
