<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo transcript reader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="home" top="back" back-href="DuoSeriesOpen.dc.html" hint-size="84px,820px"></dc-import>

<section style="flex: none; width: 456px; box-sizing: border-box; padding: 28px 32px; border-right: 1px solid #1E2028; display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">The Psychology of Money · Episode 4 of 20</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.08">Confounding Compounding</h1>
<div style="font-size: 14px; color: #A3A5B0">5 min watch · 2 min read</div>
<div style="display: flex; gap: 8px">
<button onClick="{{smaller}}" aria-label="Smaller text" style="width: 48px; height: 44px; border-radius: 10px; border: 1px solid #2A2C36; background: #15161C; color: #D4D5DC; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">A−</button>
<button onClick="{{bigger}}" aria-label="Larger text" style="width: 48px; height: 44px; border-radius: 10px; border: 1px solid #2A2C36; background: #15161C; color: #D4D5DC; font-family: Inter, sans-serif; font-size: 18px; font-weight: 600; cursor: pointer">A+</button>
<button style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid #2A2C36; background: #15161C; color: #D4D5DC; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Search transcript</button>
</div>
<div style="padding: 16px; border-radius: 16px; background: #15161C; border: 1px solid #23252E">
<h2 style="margin: 0 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A3A5B0">Key takeaways</h2>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; color: #D4D5DC">
<li>Compounding rewards time far more than a high rate of return.</li>
<li>Choose returns you can sustain for decades.</li>
<li>Avoid moves that interrupt the process.</li>
</ol>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #17181F; border: 1px solid #2A2C36">
<div style="flex: none; position: relative; width: 96px; height: 54px; border-radius: 8px; background: #24382F"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.18)"><div style="height: 3px; width: 40%; background: {{accent}}"></div></div></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 14px; font-weight: 600">Watch instead</div><div style="font-size: 12px; color: #A3A5B0">Resume at 2:04</div></div>
<a href="DuoPlayerOpen.dc.html" aria-label="Resume video at 2:04" style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg></a>
</div>
</section>

<article class="scroll" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 44px; overflow-y: auto">
<div style="max-width: 460px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{paras}}" as="p" hint-placeholder-count="6">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; padding: 12px 14px; margin: 0 -14px; border: 0; border-radius: 12px; background: {{p.bg}}; color: #E4E5EA; text-align: left; font-family: Inter, sans-serif; cursor: pointer; box-sizing: content-box">
<span style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; color: #8B8D99">{{p.t}}</span>
<span style="font-size: {{fontSize}}; line-height: 1.65">{{p.x}}</span>
<sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: {{accent}}; color: #15161B; font-size: 13px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>Play from {{p.t}}</span></sc-if>
</button>
</sc-for>
</div>
</article>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 3, size: 1 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const raw = [
      ['0:00', 'Compounding is easy to explain and hard to feel. Our instincts expect growth in straight lines.'],
      ['0:38', 'But growth that builds on itself curves upward, and most of the curve shows up late.'],
      ['1:15', 'In a long investing life, the biggest gains usually arrive in the final decades, not the first. That makes time the variable people underrate the most.'],
      ['2:04', 'Many investors chase the highest possible return. This chapter argues for a different target: good returns you can stay with, through downturns, boredom and the urge to tinker.'],
      ['3:20', 'Quitting early is the most expensive mistake, because it resets the clock compounding depends on.'],
      ['4:02', 'The same idea reaches beyond money. Skills, relationships and reputation compound too. Protect the streak; staying in the game is the strategy.']
    ];
    const paras = raw.map(([t, x], i) => {
      const on = this.state.sel === i;
      return { t, x, on, bg: on ? '#17181F' : 'transparent', pick: () => this.setState({ sel: on ? -1 : i }) };
    });
    const sizes = ['16px', '18px', '20px', '23px'];
    return {
      accent, paras,
      fontSize: sizes[this.state.size],
      smaller: () => this.setState({ size: Math.max(0, this.state.size - 1) }),
      bigger: () => this.setState({ size: Math.min(3, this.state.size + 1) })
    };
  }
}
</script>
</body>
</html>
