<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="none" top="back" back-href="DuoAuthSignIn.dc.html" show-tabs="false" hint-size="84px,820px"></dc-import>
<section style="flex: none; width: 456px; box-sizing: border-box; padding: 64px 48px; background: #24382F; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div style="font-size: 13px; font-weight: 600; color: #F5DFA0">Step 1 of 3</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -0.6px; line-height: 1.08">Reset your password</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #D6E2DA">Enter the email you signed up with and we’ll send you a link to set a new one.</p>
</section>
<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 48px 56px">
<form style="max-width: 420px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="dfp-email" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Email</label>
<input id="dfp-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid {{accent}}; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<a href="DuoCheckEmail.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Send reset link</a>
<p style="margin: 4px 0 0; text-align: center; font-size: 15px; color: #A3A5B0">Remembered it? <a href="DuoAuthSignIn.dc.html" style="font-weight: 600; color: #F2F2F5">Sign in</a></p>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5B83D' };
  }
}
</script>
</body>
</html>
