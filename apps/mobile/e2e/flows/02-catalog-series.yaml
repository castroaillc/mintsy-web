# Scenario 2: Home shows the catalog; The Psychology of Money has episodes 1–3 free and 4+ locked.
appId: com.getmintsy.app.dev
name: 02 Catalog and series tiers
---
- runFlow: common/open-home.yaml
- assertVisible: "The Psychology of Money"
- scrollUntilVisible:
    element: "Recently added"
    direction: DOWN
- takeScreenshot: 02a-home-catalog
- scrollUntilVisible:
    element: "Featured series"
    direction: UP
- runFlow: common/open-series.yaml
# Fresh account: the main button plays Episode 1
- assertVisible: "Play Episode 1 of 20"
- scrollUntilVisible:
    element: "Free · Episode 1 of 20\\..*"
    direction: DOWN
- scrollUntilVisible:
    element: "Free · Episode 3 of 20\\..*"
    direction: DOWN
- scrollUntilVisible:
    element: "Premium · Episode 4 of 20\\..*"
    direction: DOWN
- assertVisible: "Premium · Episode 5 of 20\\..*"
- takeScreenshot: 02b-series-tiers
# Expanding a locked row offers Premium instead of playback
- tapOn: "Premium · Episode 4 of 20\\..*"
- scrollUntilVisible:
    element: "Unlock with Premium"
    direction: DOWN
- takeScreenshot: 02c-locked-row
