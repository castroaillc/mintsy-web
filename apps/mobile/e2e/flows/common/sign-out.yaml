# From Settings: Sign out and confirm; ends on Home, browsing as a guest.
appId: com.getmintsy.app.dev
---
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign out?"
    timeout: 5000
# The alert's button (right of Cancel), not the page's Sign out button
- tapOn:
    text: "Sign out"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: "You.re signed out.*"
    timeout: 20000
