# Scenario 8c: Settings › Delete account with the password → Home as a guest; signing in again fails.
# Env: EMAIL, CURRENT_PASSWORD
appId: com.getmintsy.app.dev
name: 08c Delete account
---
- runFlow: common/open-home.yaml
- tapOn: "Profile"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- tapOn:
    id: "input-password"
- inputText: ${CURRENT_PASSWORD}
- scrollUntilVisible:
    element: "Delete my account"
    direction: DOWN
- tapOn: "Delete my account"
- extendedWaitUntil:
    visible: "Your account has been deleted.*"
    timeout: 20000
- assertVisible: "Featured series"
- takeScreenshot: 08e-account-deleted
- runFlow:
    file: common/sign-in.yaml
    env:
      SIGNIN_PASSWORD: ${CURRENT_PASSWORD}
- extendedWaitUntil:
    visible: "That email and password don.t match.*"
    timeout: 15000
- assertNotVisible: "Featured series"
- takeScreenshot: 08f-signin-fails
