# Scenario 8b: open the reset link from the backend log, choose a new password, sign in with it.
# Env: RESET_URL (mintsy-dev://reset-password?token=…), EMAIL, PASSWORD3
appId: com.getmintsy.app.dev
name: 08b Reset password from email link
---
- openLink: ${RESET_URL}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Choose a new password"
    timeout: 20000
- tapOn:
    id: "input-new-password"
- inputText: ${PASSWORD3}
- tapOn:
    id: "input-confirm-new-password"
- inputText: ${PASSWORD3}
- scrollUntilVisible:
    element:
      id: "reset-password-submit"
    direction: DOWN
- tapOn:
    id: "reset-password-submit"
- extendedWaitUntil:
    visible: "Password updated. Sign in with your new password."
    timeout: 15000
- takeScreenshot: 08d-password-updated
- tapOn:
    id: "input-email"
- inputText: ${EMAIL}
- tapOn:
    id: "input-password"
- inputText: ${PASSWORD3}
- scrollUntilVisible:
    element:
      id: "signin-submit"
    direction: DOWN
- tapOn:
    id: "signin-submit"
- extendedWaitUntil:
    visible: "Featured series"
    timeout: 30000
