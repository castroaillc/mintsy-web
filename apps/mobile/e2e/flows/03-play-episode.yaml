# Scenario 3: play Episode 1 (real MP4), position advances; Continue watching and Profile reflect it.
appId: com.getmintsy.app.dev
name: 03 Play episode
---
- runFlow: common/open-home.yaml
- runFlow: common/open-series.yaml
- tapOn: "Play Episode 1 of 20"
- extendedWaitUntil:
    visible: "Close player and return to series"
    timeout: 20000
# The scrubber's elapsed time passes 0:06 only if the video is really playing
- extendedWaitUntil:
    visible: "0:(0[6-9]|[1-5][0-9])"
    timeout: 60000
- assertVisible: "Pause"
- takeScreenshot: 03a-player-playing
- tapOn: "Close player and return to series"
- extendedWaitUntil:
    visible: "Resume Episode 1 of 20"
    timeout: 15000
- takeScreenshot: 03b-series-resume
- tapOn: "Back to browse"
- scrollUntilVisible:
    element: "Continue watching"
    direction: DOWN
- takeScreenshot: 03c-home-continue-watching
- scrollUntilVisible:
    element: "Profile"
    direction: UP
- tapOn: "Profile"
- extendedWaitUntil:
    visible: ".* time learning"
    timeout: 10000
- assertVisible: "In progress"
- takeScreenshot: 03d-profile-stats
