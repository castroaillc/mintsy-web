# Scenario 7: after the INITIAL_PURCHASE webhook (sent by run.sh while the app sits on Home from 06), pull to refresh
# picks up Premium without a relaunch: Profile badge, Settings › Subscription, Episode 4 unlocks and plays, downloads work.
appId: com.getmintsy.app.dev
name: 07 Premium
---
# No relaunch: the app is still on Home from 06 (scrolled down to "Recently added")
- scrollUntilVisible:
    element: "Profile"
    direction: UP
- swipe:
    start: 50%, 25%
    end: 50%, 75%
    duration: 800
- waitForAnimationToEnd

# Profile badge and Settings › Subscription
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Premium member"
    timeout: 15000
- takeScreenshot: 07a-profile-premium
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Subscription, Premium.*"
    timeout: 10000
- takeScreenshot: 07b-settings-subscription
- tapOn: "Back to profile"
- tapOn: "Back to browse"
- extendedWaitUntil:
    visible: "Featured series"
    timeout: 10000

- runFlow: common/open-series.yaml
- scrollUntilVisible:
    element: "Episode 4 of 20\\..*"
    direction: DOWN
- assertNotVisible: "Premium · Episode 4 of 20\\..*"
- assertNotVisible: "Free · Episode 1 of 20\\..*"
- takeScreenshot: 07c-series-unlocked
- tapOn: "Episode 4 of 20\\..*"
- scrollUntilVisible:
    element: "Play episode"
    direction: DOWN
- tapOn: "Play episode"
- extendedWaitUntil:
    visible: "Close player and return to series"
    timeout: 20000
- assertNotVisible: "We couldn’t load the plans right now."
- extendedWaitUntil:
    visible: "0:(0[6-9]|[1-5][0-9])"
    timeout: 60000
- takeScreenshot: 07d-episode4-playing
- tapOn: "Close player and return to series"

# Download the next episode to watch from the series page
- scrollUntilVisible:
    element: "Download Episode .*"
    direction: UP
- tapOn: "Download Episode .*"
- extendedWaitUntil:
    visible: "Downloading .*|Downloaded|All episodes downloaded.*|Download Episode .*"
    timeout: 10000
- tapOn: "Downloads"
- extendedWaitUntil:
    visible: "The Psychology of Money, Episode \\d+: .*"
    timeout: 180000
- takeScreenshot: 07e-downloads-done
- tapOn: "The Psychology of Money, Episode \\d+: .*"
- extendedWaitUntil:
    visible: "Close player and return to series"
    timeout: 20000
- extendedWaitUntil:
    visible: "0:(0[6-9]|[1-5][0-9])|0:[1-5][0-9]|[1-4]:[0-5][0-9]"
    timeout: 60000
- assertVisible: "Pause"
- takeScreenshot: 07f-download-playing
- tapOn: "Close player and return to series"
