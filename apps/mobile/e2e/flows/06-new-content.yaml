# Scenario 6: a book just published through the admin API shows up first under "Recently added" after pull to refresh.
# Env: NEW_TITLE
appId: com.getmintsy.app.dev
name: 06 Newly published book
---
- runFlow: common/open-home.yaml
# Pull to refresh
- swipe:
    start: 50%, 25%
    end: 50%, 75%
    duration: 800
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "rail-recently-added"
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible:
      text: "${NEW_TITLE} by .*"
      childOf:
        id: "rail-recently-added"
    timeout: 15000
# Nothing in the rail sits to the left of it
- assertNotVisible:
    text: ".* by .*, \\d+ episodes?"
    childOf:
      id: "rail-recently-added"
    leftOf:
      text: "${NEW_TITLE} by .*"
- takeScreenshot: 06a-recently-added
