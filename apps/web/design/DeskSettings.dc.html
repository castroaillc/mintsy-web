<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D18}
.dk{container-type:inline-size}
.dk a{color:inherit;text-decoration:none}
.dk button,.dk input{font-family:inherit}
.dk input::placeholder{color:#7A7394}
.dk-shell{display:flex;min-height:900px}
.dk-nav{flex:none;width:248px;box-sizing:border-box;padding:24px 16px;border-right:1px solid #2A2740;background:#13111E;display:flex;flex-direction:column;gap:28px}
.dk-navlist{display:flex;flex-direction:column;gap:4px}
.dk-main{flex:1;min-width:0}
.dk-pad{padding:32px 48px 64px}
.dk .dk-navitem:hover{background:#201D2E;color:#F4F2F8}
.dk .dk-btn:hover{background:#FF8E7D}
.dk .dk-ghost:hover{border-color:#57516F;background:#1B1929}
.dk .dk-card:hover{border-color:#45405E}
.dk .dk-row:hover{background:#1B1929}
.dk .dk-link:hover{color:#FF8E7D}
.dk .dk-cover:hover{transform:translateY(-3px)}
.dk-cover{transition:transform .15s ease}
@media (prefers-reduced-motion: reduce){.dk-cover{transition:none}.dk .dk-cover:hover{transform:none}}
@container (max-width: 860px){
  .dk-shell{flex-direction:column}
  .dk-nav{width:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;border-right:0;border-bottom:1px solid #2A2740;gap:12px}
  .dk-navlist{flex-direction:row;gap:2px}
  .dk-navlabel,.dk-hide-sm{display:none !important}
  .dk-pad{padding:24px 20px 48px}
}
@container (max-width: 520px){ .dk-pad{padding:20px 16px 40px} }
</style>
</helmet>
<div class="dk" style="width: 100%; min-width: 0; min-height: 900px; background: #0E0D18; color: #F4F2F8; font-family: Inter, system-ui, sans-serif">
<div class="dk-shell"><nav class="dk-nav" aria-label="Main"><a href="DeskHome.dc.html" aria-label="mintsy home" style="padding: 4px 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.03em; line-height: 1">mintsy<span style="color: #FF6B57">.</span></span></a><div class="dk-navlist"><a class="dk-navitem" href="DeskHome.dc.html" aria-label="Home" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span class="dk-navlabel">Home</span></a><a class="dk-navitem" href="DeskSearch.dc.html" aria-label="Search" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><span class="dk-navlabel">Search</span></a><a class="dk-navitem" href="DeskLibrary.dc.html" aria-label="My List" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><span class="dk-navlabel">My List</span></a><a class="dk-navitem" href="DeskProfile.dc.html" aria-current="page" aria-label="Profile" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: #201D2E; color: #F4F2F8; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg><span class="dk-navlabel">Profile</span></a></div><div class="dk-hide-sm" style="margin-top: auto; display: flex; flex-direction: column; gap: 16px"><a class="dk-card" href="DeskPlayer.dc.html" style="padding: 12px; border-radius: 14px; background: #181626; border: 1px solid #2A2740; display: flex; gap: 12px; align-items: center"><div style="flex: none; width: 44px; height: 44px; border-radius: 10px; background: #2B2850; display: flex; align-items: center; justify-content: center; color: #F4F2F8"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></div><div style="min-width: 0"><div style="font-size: 12px; font-weight: 600; color: #FF6B57">Continue · Episode 4 of 20</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Confounding Compounding</div></div></a><a class="dk-navitem" href="DeskProfile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px"><div style="flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #FF6B57; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700">S</div><div><div style="font-size: 14px; font-weight: 600">Steve</div><div style="font-size: 12px; color: #9690AE">Premium · Yearly</div></div></a></div></nav><main class="dk-main"><div class="dk-pad" style="display: flex; flex-direction: column; gap: 28px; max-width: 820px">
<a class="dk-link" href="DeskProfile.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #ACA6C2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Profile</a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance">Settings</h1>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #9690AE">{{s.title}}</div>
<div style="border-radius: 16px; background: #181626; border: 1px solid #2A2740; overflow: hidden">
<sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
<div style="border-top: {{r.border}}">
<sc-if value="{{r.isLink}}" hint-placeholder-val="{{ true }}"><a class="dk-row" href="{{r.href}}" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 56px; padding: 0 18px; font-size: 15px"><span>{{r.label}}</span><span style="color: #ACA6C2">{{r.value}} ›</span></a></sc-if>
<sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}"><button role="switch" aria-checked="{{r.on}}" onClick="{{r.flip}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; padding: 8px 18px; border: 0; background: transparent; color: #F4F2F8; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{r.label}}</span><span style="font-size: 13px; color: #9690AE">{{r.hint}}</span></span><span style="flex: none; width: 46px; height: 28px; border-radius: 999px; background: {{r.track}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{r.justify}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span></button></sc-if>
</div>
</sc-for>
</div></section>
</sc-for>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a class="dk-ghost" href="DeskWelcome.dc.html" style="box-sizing: border-box; height: 48px; padding: 0 20px; border-radius: 12px; background: transparent; color: #F4F2F8; border: 1px solid #3D3956; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap">Sign out</a><a class="dk-ghost" href="DeskDeleteAccount.dc.html" style="height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid #5A2A2E; color: #FF6467; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600">Delete account</a></div>
<div style="font-size: 13px; color: #7A7394">mintsy for web 1.0.0</div>
</div></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { autoplay: true, captions: false, reminder: true, email: false, newSeries: true } };
  }
  renderVals() {
    const on = this.state.on;
    const link = (label, value, href) => ({ isLink: true, isToggle: false, label, value, href: href || '#' });
    const toggle = (key, label, hint) => ({ isLink: false, isToggle: true, label, hint, on: !!on[key], track: on[key] ? '#FF6B57' : '#3D3956', justify: on[key] ? 'flex-end' : 'flex-start', flip: () => this.setState({ on: Object.assign({}, on, { [key]: !on[key] }) }) });
    const sections = [
      { title: 'Account', rows: [link('Plan', 'Free · Upgrade', 'DeskPlanDetails.dc.html'), link('Email', 'you@example.com', 'DeskProfileEdit.dc.html'), link('Password', 'Change password', 'DeskChangePassword.dc.html')] },
      { title: 'Playback', rows: [toggle('autoplay', 'Autoplay next episode', 'Keep the series going'), link('Default speed', '1×'), toggle('captions', 'Captions on by default', 'Show captions in the player')] },
      { title: 'Notifications', rows: [toggle('reminder', 'Daily reminder', 'Browser notification at 8:00 AM'), toggle('email', 'Email me the reminder instead', 'Sent to you@example.com'), toggle('newSeries', 'New series in your interests', 'At most once a week')] },
      { title: 'About', rows: [link('Send feedback', ''), link('Terms of Service', ''), link('Privacy Policy', '')] }
    ].map((s) => Object.assign(s, { rows: s.rows.map((r, i) => Object.assign(r, { border: i ? '1px solid #2A2740' : '0' })) }));
    return { sections };
  }
}
</script>
</body>
</html>
