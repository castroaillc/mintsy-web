<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0D18}
.dk{container-type:inline-size}
.dk a{color:inherit;text-decoration:none}
.dk button,.dk input{font-family:inherit}
.dk input::placeholder{color:#7A7394}
.dk-shell{display:flex;min-height:900px}
.dk-nav{flex:none;width:248px;box-sizing:border-box;padding:24px 16px;border-right:1px solid #2A2740;background:#13111E;display:flex;flex-direction:column;gap:28px}
.dk-navlist{display:flex;flex-direction:column;gap:4px}
.dk-main{flex:1;min-width:0}
.dk-pad{padding:32px 48px 64px}
.dk .dk-navitem:hover{background:#201D2E;color:#F4F2F8}
.dk .dk-btn:hover{background:#FF8E7D}
.dk .dk-ghost:hover{border-color:#57516F;background:#1B1929}
.dk .dk-card:hover{border-color:#45405E}
.dk .dk-row:hover{background:#1B1929}
.dk .dk-link:hover{color:#FF8E7D}
.dk .dk-cover:hover{transform:translateY(-3px)}
.dk-cover{transition:transform .15s ease}
@media (prefers-reduced-motion: reduce){.dk-cover{transition:none}.dk .dk-cover:hover{transform:none}}
@container (max-width: 860px){
  .dk-shell{flex-direction:column}
  .dk-nav{width:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px;border-right:0;border-bottom:1px solid #2A2740;gap:12px}
  .dk-navlist{flex-direction:row;gap:2px}
  .dk-navlabel,.dk-hide-sm{display:none !important}
  .dk-pad{padding:24px 20px 48px}
}
@container (max-width: 520px){ .dk-pad{padding:20px 16px 40px} }
</style>
</helmet>
<div class="dk" style="width: 100%; min-width: 0; min-height: 900px; background: #0E0D18; color: #F4F2F8; font-family: Inter, system-ui, sans-serif">
<div class="dk-shell"><nav class="dk-nav" aria-label="Main"><a href="DeskHome.dc.html" aria-label="mintsy home" style="padding: 4px 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.03em; line-height: 1">mintsy<span style="color: #FF6B57">.</span></span></a><div class="dk-navlist"><a class="dk-navitem" href="DeskHome.dc.html" aria-label="Home" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span class="dk-navlabel">Home</span></a><a class="dk-navitem" href="DeskSearch.dc.html" aria-label="Search" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg><span class="dk-navlabel">Search</span></a><a class="dk-navitem" href="DeskLibrary.dc.html" aria-label="My List" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: transparent; color: #ACA6C2; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg><span class="dk-navlabel">My List</span></a><a class="dk-navitem" href="DeskProfile.dc.html" aria-current="page" aria-label="Profile" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; background: #201D2E; color: #F4F2F8; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6B57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg><span class="dk-navlabel">Profile</span></a></div><div class="dk-hide-sm" style="margin-top: auto; display: flex; flex-direction: column; gap: 16px"><a class="dk-card" href="DeskPlayer.dc.html" style="padding: 12px; border-radius: 14px; background: #181626; border: 1px solid #2A2740; display: flex; gap: 12px; align-items: center"><div style="flex: none; width: 44px; height: 44px; border-radius: 10px; background: #2B2850; display: flex; align-items: center; justify-content: center; color: #F4F2F8"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></div><div style="min-width: 0"><div style="font-size: 12px; font-weight: 600; color: #FF6B57">Continue · Episode 4 of 20</div><div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Confounding Compounding</div></div></a><a class="dk-navitem" href="DeskProfile.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px"><div style="flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid #FF6B57; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700">S</div><div><div style="font-size: 14px; font-weight: 600">Steve</div><div style="font-size: 12px; color: #9690AE">Premium · Yearly</div></div></a></div></nav><main class="dk-main"><div class="dk-pad" style="display: flex; flex-direction: column; gap: 24px; max-width: 720px">
<a class="dk-link" href="DeskSettings.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #ACA6C2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Settings</a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance">Subscription</h1>
<section style="padding: 26px; border-radius: 20px; background: #2B2850; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">mintsy<span style="color: #FF6B57">.</span> Premium</span><span style="padding: 4px 10px; border-radius: 999px; background: {{badgeBg}}; color: {{badgeFg}}; font-size: 12px; font-weight: 700">{{badge}}</span></div>
<div style="font-size: 16px; color: #CFCBDE">Yearly · [YEARLY PRICE]</div><div style="font-size: 15px; color: #F4F2F8">{{statusLine}}</div></section>
<div style="border-radius: 16px; background: #181626; border: 1px solid #2A2740">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; border-top: {{r.border}}; font-size: 15px"><span style="color: #ACA6C2">{{r.label}}</span><span style="text-align: right">{{r.value}}</span></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a class="dk-ghost" href="#" style="box-sizing: border-box; height: 48px; padding: 0 20px; border-radius: 12px; background: #F4F2F8; color: #1A1424; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; white-space: nowrap">{{manageLabel}}</a></div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #9690AE">{{note}}</p>
</div></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}, "status": {"editor": "enum", "options": ["trial", "active", "cancelled"], "default": "trial"}, "store": {"editor": "enum", "options": ["web", "app-store"], "default": "web"}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status ?? 'trial';
    const store = this.props.store ?? 'web';
    const m = {
      trial: { badge: 'FREE TRIAL', badgeBg: '#FF6B57', badgeFg: '#1A1424', statusLine: 'Trial ends [TRIAL END DATE]. Then [YEARLY PRICE]/year.', next: 'First charge [TRIAL END DATE]' },
      active: { badge: 'ACTIVE', badgeBg: '#8FD3FF', badgeFg: '#1A1424', statusLine: 'Renews [RENEWAL DATE].', next: 'Renews [RENEWAL DATE]' },
      cancelled: { badge: 'ENDS SOON', badgeBg: '#3D3956', badgeFg: '#F4F2F8', statusLine: 'Premium stays on until [END DATE].', next: 'Ends [END DATE]' }
    }[s];
    const web = store === 'web';
    const rows = [['Plan', 'Yearly'], ['Billing', m.next], ['Bought on', web ? 'getmintsy.com (card ending [LAST 4])' : 'App Store on iPhone'], ['Member since', 'Oct 2026']].map(([label, value], i) => ({ label, value, border: i ? '1px solid #2A2740' : '0' }));
    return Object.assign({}, m, { rows,
      manageLabel: web ? (s === 'cancelled' ? 'Resubscribe' : 'Manage billing') : 'Manage on your iPhone',
      note: web ? 'Change plan, update your card or cancel in the billing portal. If you cancel, Premium stays on until the end of the period you’ve paid for.' : 'You subscribed in the App Store, so changes happen on your iPhone: Settings › your name › Subscriptions. Premium works here and in the app either way.' });
  }
}
</script>
</body>
</html>
