<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo player, half-folded on a table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 820px; height: 1080px; position: relative; box-sizing: border-box; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">

<section aria-label="Video" style="position: absolute; left: 24px; right: 24px; top: 24px; height: 468px; border-radius: 18px; overflow: hidden; background: #24382F">
<div style="position: absolute; left: 40px; top: 150px; display: flex; flex-direction: column; gap: 12px">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 1.4px; color: #E7DFCF">CHAPTER 4</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 56px; line-height: 1; color: #F4EFE6; max-width: 460px">Confounding Compounding</div>
</div>
<div style="position: absolute; left: 14px; top: 14px">
<a href="DuoSeriesOpen.dc.html" aria-label="Close player" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(13,14,18,0.55); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg>
</a>
</div>
</section>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 539px; height: 0; border-top: 2px dashed rgba(163,165,176,0.35)"></div>
<div class="dc-annot" aria-hidden="true" style="position: absolute; right: 12px; top: 520px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #6B6E7A">FOLD · NOTHING TAPPABLE HERE</div>

<section aria-label="Controls and transcript" style="position: absolute; left: 32px; right: 32px; top: 580px; bottom: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Episode 4 of 20</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Confounding Compounding</div>
</div>
<div style="font-size: 14px; font-variant-numeric: tabular-nums; color: #A3A5B0">{{timeNow}} / 5:12</div>
</div>

<div style="position: relative; height: 6px; border-radius: 3px; background: #2A2C36">
<div style="height: 6px; border-radius: 3px; width: {{pct}}; background: {{accent}}"></div>
<div style="position: absolute; top: -7px; left: {{pct}}; width: 20px; height: 20px; margin-left: -10px; border-radius: 10px; background: #FFFFFF"></div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 28px">
<a href="#" aria-label="Previous episode" style="width: 60px; height: 60px; border-radius: 30px; background: #15161C; border: 1px solid #2A2C36; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 5v14L8 12z"></path><rect x="5" y="5" width="2.5" height="14" rx="1"></rect></svg>
</a>
<button aria-label="Back 10 seconds" style="width: 60px; height: 60px; border-radius: 30px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"></path></svg>
</button>
<button onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 88px; height: 88px; border-radius: 44px; border: 0; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
</sc-if>
</button>
<button aria-label="Forward 10 seconds" style="width: 60px; height: 60px; border-radius: 30px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v4h-4"></path></svg>
</button>
<a href="#" aria-label="Next episode" style="width: 60px; height: 60px; border-radius: 30px; background: #15161C; border: 1px solid #2A2C36; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5v14l10-7z"></path><rect x="16.5" y="5" width="2.5" height="14" rx="1"></rect></svg>
</a>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 18px 22px; border-radius: 18px; background: #121318; border: 1px solid #23252E">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #A3A5B0">Now · {{timeNow}}</div>
<p style="margin: 0; font-size: 22px; line-height: 1.45; font-weight: 600; color: #FFFFFF">{{currentLine}}</p>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #8B8D99">{{nextLine}}</p>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":820,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#F5B83D',
      pct: '40%',
      timeNow: '2:04',
      currentLine: 'Many investors chase the highest possible return. This chapter argues for a different target.',
      nextLine: 'Aim for good returns you can stay with, through downturns, boredom and the urge to tinker.',
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>
