<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forgot password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 32px; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<a href="AuthSignIn.dc.html" aria-label="Back to sign in" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.5px">Reset your password</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">Enter the email you signed up with and we’ll send you a link to set a new one.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 32px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="fp-email" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Email</label>
<input id="fp-email" type="email" autocomplete="email" placeholder="you@example.com" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid {{accent}}; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<a href="CheckEmail.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Send reset link</a>
</form>
<p style="margin: auto 0 0; text-align: center; font-size: 15px; color: #A3A5B0">Remembered it? <a href="AuthSignIn.dc.html" style="font-weight: 600; color: #F2F2F5">Sign in</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5B83D' };
  }
}
</script>
</body>
</html>
