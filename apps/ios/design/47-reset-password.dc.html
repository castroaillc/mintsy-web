<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set a new password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 24px 32px; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="height: 44px"></div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 20px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.5px">Set a new password</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">For you@example.com. You’ll stay signed in on this phone.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 32px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rp-new" style="font-size: 14px; font-weight: 600; color: #D4D5DC">New password</label>
<div style="display: flex; align-items: center; height: 52px; padding: 0 4px 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C">
<input id="rp-new" type="{{passType}}" autocomplete="new-password" value="compound2026" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #A3A5B0; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6FCF97"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>At least 8 characters</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="rp-confirm" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Confirm new password</label>
<input id="rp-confirm" type="password" autocomplete="new-password" placeholder="Type it again" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<a href="Main.dc.html" style="margin-top: 8px; height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save and sign in</a>
</form>
<p style="margin: auto 0 0; text-align: center; font-size: 14px; line-height: 1.5; color: #8B8D99">This link expired? <a href="ForgotPassword.dc.html" style="font-weight: 600; color: #F2F2F5">Send a new one</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: false };
  }
  renderVals() {
    return {
      accent: this.props.accent ?? '#F5B83D',
      passType: this.state.show ? 'text' : 'password',
      toggleLabel: this.state.show ? 'Hide password' : 'Show password',
      toggle: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
