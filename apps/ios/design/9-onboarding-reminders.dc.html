<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: daily reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; padding: 16px 24px 0; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">

<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="OnbTime.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div aria-label="Step 3 of 4" role="img" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: #2A2C36"></div>
</div>
<a href="OnbFirstBook.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 15px; font-weight: 500; color: #A3A5B0">Skip</a>
</div>

<div aria-hidden="true" style="position: relative; height: 210px; margin-top: 20px; border-radius: 22px; background: #24382F; overflow: hidden; display: flex; align-items: center; justify-content: center">
<div style="width: 300px; box-sizing: border-box; padding: 14px; border-radius: 18px; background: rgba(23,24,31,0.92); border: 1px solid #343744; display: flex; gap: 12px; box-shadow: 0 14px 30px rgba(0,0,0,0.4)">
<div style="flex: none; width: 38px; height: 38px; border-radius: 9px; background: #15161C; border: 1px solid #2A2C36; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; line-height: 1; letter-spacing: -1px; margin-top: -5px">m<span style="color: {{accent}}">.</span></div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #A3A5B0"><span style="font-weight: 600; color: #D4D5DC">mintsy</span><span>now</span></div>
<div style="font-size: 14px; font-weight: 600">Episode 5 of 20 is ready</div>
<div style="font-size: 13px; line-height: 1.35; color: #C9CAD2">Getting Wealthy vs. Staying Wealthy · 5 min</div>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 26px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Step 3 of 4</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.5px">Want a daily nudge?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">One reminder a day with your next episode. Change it anytime in Settings.</p>
</div>

<div role="radiogroup" aria-label="Reminder time" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="3">
<button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="height: 72px; border-radius: 14px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: #F2F2F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: Inter, sans-serif; cursor: pointer">
<span style="font-size: 13px; color: #A3A5B0">{{t.label}}</span>
<span style="font-size: 16px; font-weight: 600">{{t.time}}</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 24px 28px; background: #0D0E12; display: flex; flex-direction: column; gap: 6px">
<a href="OnbFirstBook.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Turn on reminders</a>
<a href="OnbFirstBook.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #A3A5B0">Not now</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const times = [['Morning', '8:00 AM'], ['Lunch', '12:30 PM'], ['Evening', '8:00 PM']].map(([label, time], i) => {
      const on = this.state.sel === i;
      return { label, time, on, bd: on ? accent : '#2A2C36', bg: on ? '#1A1912' : '#15161C', pick: () => this.setState({ sel: i }) };
    });
    return { accent, times };
  }
}
</script>
</body>
</html>
