<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iPhone Duo onboarding: interests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1080px; height: 820px; display: flex; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">
<dc-import name="DuoRail" active="none" top="none" show-tabs="false" hint-size="84px,820px"></dc-import>

<section style="flex: none; width: 456px; box-sizing: border-box; padding: 56px 48px; border-right: 1px solid #1E2028; display: flex; flex-direction: column; gap: 32px">
<ol aria-label="Onboarding steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<li aria-current="{{s.current}}" style="display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: {{s.weight}}; color: {{s.fg}}">
<span style="flex: none; width: 28px; height: 28px; border-radius: 14px; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: #15161B; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{s.mark}}</span>
{{s.label}}
</li>
</sc-for>
</ol>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Step 1 of 4</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; line-height: 1.08; letter-spacing: -0.6px">What do you want to learn about?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">Pick at least 3. We’ll use them to suggest series for you.</p>
</div>
</section>

<section style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 56px 48px 32px">
<div style="flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="14">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 46px; padding: 0 18px; border-radius: 23px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; gap: 8px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{t.label}}
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<a href="DuoOnbTime.dc.html" style="height: 52px; padding: 0 18px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #A3A5B0">Skip</a>
<a href="DuoOnbTime.dc.html" style="min-width: 240px; height: 52px; padding: 0 22px; border-radius: 14px; background: {{ctaBg}}; color: {{ctaFg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ctaLabel}}</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":1080,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Finance', 'Psychology', 'Productivity'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const step = 1;
    const steps = ['Interests', 'Daily time', 'Reminders', 'First series'].map((label, i) => {
      const n = i + 1, done = n < step, cur = n === step;
      return { label, current: cur ? 'step' : 'false', mark: done ? '✓' : String(n), fill: done ? accent : 'transparent', ring: done || cur ? accent : '#3A3D49', fg: cur ? '#F2F2F5' : done ? '#C9CAD2' : '#8B8D99', weight: cur ? 600 : 500 };
    });
    const picked = this.state.picked;
    const topics = ['Finance', 'Investing', 'Business', 'Leadership', 'Psychology', 'Productivity', 'Health', 'Science', 'History', 'Philosophy', 'Relationships', 'Creativity', 'Marketing', 'Startups'].map((label) => {
      const on = picked.includes(label);
      return { label, on, bg: on ? '#2A2416' : '#15161C', bd: on ? accent : '#2A2C36', fg: on ? '#FFFFFF' : '#D4D5DC', pick: () => this.setState({ picked: on ? picked.filter((p) => p !== label) : picked.concat(label) }) };
    });
    const n = picked.length, ready = n >= 3;
    return {
      accent, steps, topics,
      ctaLabel: ready ? 'Continue · ' + n + ' selected' : 'Pick ' + (3 - n) + ' more',
      ctaBg: ready ? accent : '#23252E',
      ctaFg: ready ? '#15161B' : '#A3A5B0'
    };
  }
}
</script>
</body>
</html>
