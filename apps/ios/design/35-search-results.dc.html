<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">

<div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 0">
<label for="sr-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
<div style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; border-radius: 14px; background: #17181F; border: 1px solid {{accent}}; color: #8B8D99">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="sr-q" type="search" value="money" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px">
<button aria-label="Clear search" style="width: 32px; height: 32px; border-radius: 16px; border: 0; background: #2A2C36; color: #D4D5DC; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 15px; color: #A3A5B0">Cancel</a>
</div>

<div role="tablist" aria-label="Result type" style="display: flex; gap: 8px; padding: 14px 20px 4px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid {{f.bd}}; background: {{f.bg}}; color: {{f.fg}}; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>

<div style="height: 660px; overflow-y: auto; padding: 0 20px 24px; box-sizing: border-box">
<sc-if value="{{showBooks}}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 18px 0 10px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A3A5B0">Books · 3</h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{books}}" as="b" hint-placeholder-count="3">
<a href="Book.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 8px; border-radius: 14px; background: #15161C; border: 1px solid #23252E">
<span style="flex: none; width: 48px; height: 72px; border-radius: 5px; background: {{b.bg}}; color: {{b.fg}}; box-sizing: border-box; padding: 6px 5px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 8px; line-height: 1.1">{{b.title}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">{{b.title}}</span>
<span style="font-size: 13px; color: #A3A5B0">{{b.author}} · {{b.eps}} episodes</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6E7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{showEpisodes}}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 24px 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #A3A5B0">Episodes that mention “money” · 24</h2>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{episodes}}" as="e" hint-placeholder-count="4">
<li style="border-bottom: 1px solid #1E2028">
<a href="Player.dc.html" style="display: flex; flex-direction: column; gap: 5px; padding: 14px 0">
<span style="font-size: 12px; font-weight: 600; color: {{accent}}">{{e.book}} · Episode {{e.n}} of 20 · at {{e.at}}</span>
<span style="font-size: 15px; font-weight: 600">{{e.title}}</span>
<span style="font-size: 14px; line-height: 1.45; color: #A3A5B0">“…{{e.pre}}<mark style="background: #3A3016; color: #FFE3A3; border-radius: 3px; padding: 0 2px">{{e.hit}}</mark>{{e.post}}…”</span>
</a>
</li>
</sc-for>
</ol>
<a href="#" style="display: flex; align-items: center; justify-content: center; height: 48px; margin-top: 8px; font-size: 14px; font-weight: 600; color: #D4D5DC">Show all 24 episodes</a>
</sc-if>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" active="search" accent="{{accent}}" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const filters = [['all', 'All'], ['books', 'Books'], ['episodes', 'Episodes']].map(([id, label]) => {
      const on = this.state.filter === id;
      return { label, on, bg: on ? '#F2F2F5' : '#17181F', fg: on ? '#15161B' : '#D4D5DC', bd: on ? '#F2F2F5' : '#2A2C36', pick: () => this.setState({ filter: id }) };
    });
    const books = [
      { title: 'The Psychology of Money', author: 'Morgan Housel', eps: 20, bg: '#E7DFCF', fg: '#1C1C1C' },
      { title: 'I Will Teach You to Be Rich', author: 'Ramit Sethi', eps: 10, bg: '#E2B34C', fg: '#1C1C1C' },
      { title: 'Rich Dad Poor Dad', author: 'Robert T. Kiyosaki', eps: 10, bg: '#5B2333', fg: '#F7E9EC' }
    ];
    const episodes = [
      { book: 'The Psychology of Money', n: 9, at: '1:42', title: 'Wealth Is What You Don’t See', pre: 'wealth is the ', hit: 'money', post: ' you chose not to spend' },
      { book: 'The Psychology of Money', n: 10, at: '0:18', title: 'Save Money', pre: 'you don’t need a reason to save ', hit: 'money', post: '. Savings buy options' },
      { book: 'Rich Dad Poor Dad', n: 2, at: '2:05', title: 'Why Teach Financial Literacy?', pre: 'it’s not how much ', hit: 'money', post: ' you make, it’s how much you keep' },
      { book: 'I Will Teach You to Be Rich', n: 4, at: '3:11', title: 'Conscious Spending', pre: 'spend ', hit: 'money', post: ' extravagantly on the things you love' }
    ];
    const f = this.state.filter;
    return { accent, filters, books, episodes, showBooks: f !== 'episodes', showEpisodes: f !== 'books' };
  }
}
</script>
</body>
</html>
