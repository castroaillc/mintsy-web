<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: pick interests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; padding: 16px 24px 0; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif">

<div style="display: flex; align-items: center; gap: 16px; height: 44px">
<div aria-label="Step 1 of 4" role="img" style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: #2A2C36"></div>
<div style="height: 4px; border-radius: 2px; background: #2A2C36"></div>
<div style="height: 4px; border-radius: 2px; background: #2A2C36"></div>
</div>
<a href="OnbTime.dc.html" style="min-width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 15px; font-weight: 500; color: #A3A5B0">Skip</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 24px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Step 1 of 4</div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -0.5px">What do you want to learn about?</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #A3A5B0">Pick at least 3. We’ll use them to suggest series for you.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="14">
<button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; gap: 8px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
{{t.label}}
</button>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 24px 32px; background: #0D0E12; border-top: 1px solid #1E2028">
<a href="OnbTime.dc.html" style="height: 54px; border-radius: 14px; background: {{ctaBg}}; color: {{ctaFg}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{ctaLabel}}</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Finance', 'Psychology', 'Productivity'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F5B83D';
    const all = ['Finance', 'Investing', 'Business', 'Leadership', 'Psychology', 'Productivity', 'Health', 'Science', 'History', 'Philosophy', 'Relationships', 'Creativity', 'Marketing', 'Startups'];
    const picked = this.state.picked;
    const topics = all.map((label) => {
      const on = picked.includes(label);
      return {
        label,
        on,
        bg: on ? '#2A2416' : '#15161C',
        bd: on ? accent : '#2A2C36',
        fg: on ? '#FFFFFF' : '#D4D5DC',
        pick: () => this.setState({ picked: on ? picked.filter((p) => p !== label) : picked.concat(label) })
      };
    });
    const n = picked.length;
    const ready = n >= 3;
    return {
      accent,
      topics,
      ctaLabel: ready ? 'Continue · ' + n + ' selected' : 'Pick ' + (3 - n) + ' more',
      ctaBg: ready ? accent : '#23252E',
      ctaFg: ready ? '#15161B' : '#A3A5B0'
    };
  }
}
</script>
</body>
</html>
