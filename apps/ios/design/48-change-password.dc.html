<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0E12}
a{color:#F2F2F5;text-decoration:none}a:hover{color:#FFFFFF}
input::placeholder{color:#8B8D99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 32px; background: #0D0E12; color: #F2F2F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 6px; height: 44px">
<a href="ProfileSettings.dc.html" aria-label="Back to settings" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px">Change password</h1>
</header>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cp-current" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Current password</label>
<input id="cp-current" type="password" autocomplete="current-password" placeholder="Your current password" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
<a href="ForgotPassword.dc.html" style="align-self: flex-start; font-size: 14px; font-weight: 500; color: {{accent}}">Forgot it?</a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cp-new" style="font-size: 14px; font-weight: 600; color: #D4D5DC">New password</label>
<input id="cp-new" type="password" autocomplete="new-password" placeholder="At least 8 characters" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cp-confirm" style="font-size: 14px; font-weight: 600; color: #D4D5DC">Confirm new password</label>
<input id="cp-confirm" type="password" autocomplete="new-password" placeholder="Type it again" style="height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #2A2C36; background: #15161C; color: #F2F2F5; font-family: Inter, sans-serif; font-size: 16px; outline: none">
</div>
<label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; cursor: pointer">
<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: {{accent}}">
Sign out of other devices
</label>
<a href="ProfileSettings.dc.html" style="margin-top: 4px; height: 54px; border-radius: 14px; background: {{accent}}; color: #15161B; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Update password</a>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F5B83D","options":["#F5B83D","#6EE7B7","#8FB0FF","#FF8A65"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F5B83D' };
  }
}
</script>
</body>
</html>
